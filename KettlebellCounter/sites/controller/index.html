<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'">
    <title>Счётчик команды</title>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <style>
        /* Interface colors come from the site theme — see /theme.css; --c is the team color, set by controller.js */
        :root {
            --alarm: #ff3b30;
            --c: #e5007d; --timer: #ffffff;
            --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; }
        body { display: flex; flex-direction: column; min-height: 100vh; touch-action: manipulation; user-select: none; }
        header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            background: linear-gradient(100deg, var(--head-1) 0%, var(--head-2) 70%, var(--head-3) 100%); border-bottom: 4px solid var(--accent); }
        #logo { height: 32px; width: auto; display: block; }
        header b { font-size: 18px; letter-spacing: .1em; }
        .conn { margin-left: auto; font-size: 12px; color: var(--head-dim); display: inline-flex; align-items: center; gap: 6px; }
        .conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #2fd07a; }
        .conn.off::before { background: #ff4d4d; }
        main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 16px; max-width: 520px; width: 100%; margin: 0 auto; }
        .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .readout { font: 700 54px/1 var(--mono); color: var(--timer); font-variant-numeric: tabular-nums; }
        .readout.alarm { color: var(--alarm); }
        .status { color: var(--dim); font-size: 14px; }
        .team { flex: 1; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
            border-top: 6px solid var(--c); border-radius: 12px; padding: 12px 14px 14px; }
        .name { width: 100%; font: 700 20px var(--mono); color: var(--c); text-transform: uppercase; background: transparent;
            border: 0; border-bottom: 1px solid var(--line); padding: 4px 0; }
        .name:focus { outline: none; border-bottom-color: var(--c); }
        .count { flex: 1; display: flex; align-items: center; justify-content: center; font: 700 clamp(120px, 38vw, 220px)/1 var(--mono); color: var(--c); }
        .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
        button { font: inherit; color: inherit; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
        button:active:not(:disabled) { filter: brightness(1.3); }
        button:disabled { opacity: .4; }
        .btns button { font-size: 44px; padding: 22px 0; }
        .btns .up { background: var(--c); border-color: var(--c); color: var(--c-ink, #fff); font-weight: 700; }
        .small { margin-top: 10px; display: flex; justify-content: space-between; gap: 10px; }
        .small button { font-size: 14px; padding: 8px 14px; border-radius: 9px; }
        .msg { text-align: center; color: var(--dim); padding: 40px 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <img id="logo" src="/logo.png" alt="">
        <b>ТГАСУ</b>
        <span class="conn off" id="conn">нет связи…</span>
        <select class="themepick" id="themeSel" title="Тема сайта" aria-label="Тема сайта"></select>
    </header>
    <main>
        <div class="top">
            <div class="readout" id="read">00:00</div>
            <div class="status" id="status">—</div>
        </div>
        <section class="team" id="team">
            <input class="name" id="name" type="text" maxlength="14" spellcheck="false" autocomplete="off" placeholder="Название команды">
            <div class="count" id="count">0</div>
            <div class="btns">
                <button id="bDown">−1</button>
                <button id="bUp" class="up">+1</button>
            </div>
            <div class="small">
                <button id="bReset">Обнулить счёт</button>
                <button id="bExit">Выйти</button>
            </div>
        </section>
        <div class="msg hidden" id="gone">Эта команда удалена администратором.</div>
    </main>
    <script src="/render.js"></script>
    <script src="/net.js"></script>
    <script src="/controller.js"></script>
</body>
</html>

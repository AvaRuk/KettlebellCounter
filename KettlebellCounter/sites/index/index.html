<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'">
    <title>ТГАСУ — гиревой спорт</title>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <style>
        /* Interface colors come from the site theme — see /theme.css */
        :root {
            --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; }
        body { display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; align-items: center; gap: 14px; padding: 12px 20px;
            background: linear-gradient(100deg, var(--head-1) 0%, var(--head-2) 70%, var(--head-3) 100%); border-bottom: 4px solid var(--accent); }
        #logo { height: 40px; width: auto; display: block; }
        .brand { display: flex; flex-direction: column; line-height: 1.15; }
        .brand b { font-size: 24px; letter-spacing: .14em; font-weight: 800; }
        .brand span { font-size: 12px; color: var(--head-dim); }
        header select.themepick { margin-left: auto; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--accent);
            border-radius: 12px; padding: 22px; }
        h1 { margin: 0 0 6px; font-size: 22px; }
        p { margin: 0 0 16px; color: var(--dim); font-size: 14px; }
        input { width: 100%; font: 700 28px var(--mono); letter-spacing: .3em; text-align: center; color: inherit;
            background: var(--input); border: 1px solid var(--line); border-radius: 9px; padding: 12px 10px; }
        input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px var(--ring); }
        button { width: 100%; margin-top: 12px; font: 700 18px "Segoe UI", system-ui, sans-serif; color: var(--on-accent); background: var(--accent);
            border: 1px solid var(--accent); border-radius: 9px; padding: 12px; cursor: pointer; }
        button:hover:not(:disabled) { background: var(--accent-hi); }
        button:disabled { opacity: .5; cursor: default; }
        .err { min-height: 1.4em; margin: 10px 0 0; color: var(--err); font-size: 14px; }
        .links { margin-top: 14px; text-align: center; font-size: 14px; }
        .links a { color: var(--link); }
    </style>
</head>
<body>
    <header>
        <img id="logo" src="/logo.png" alt="">
        <div class="brand"><b>ТГАСУ</b><span>Томский государственный архитектурно-строительный университет</span></div>
        <select class="themepick" id="themeSel" title="Тема сайта" aria-label="Тема сайта"></select>
    </header>
    <main>
        <form class="card" id="form" autocomplete="off">
            <h1>Гиревой спорт</h1>
            <p>Введите PIN-код: судья команды попадёт к своему счётчику, хронометрист — к пульту таймера, главный судья — в админ-панель.</p>
            <input id="pin" type="password" inputmode="numeric" maxlength="12" autofocus placeholder="••••">
            <button id="go" type="submit">Войти</button>
            <div class="err" id="err"></div>
            <div class="links"><a href="/display">Открыть табло</a></div>
        </form>
    </main>
    <script src="/net.js"></script>
    <script src="/index.js"></script>
</body>
</html>
